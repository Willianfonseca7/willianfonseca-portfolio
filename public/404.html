<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Weiterleitung — Willian Fonseca</title>
    <script>
      (() => {
        const base = "/willianfonseca-portfolio";
        const path = location.pathname.startsWith(base + "/")
          ? location.pathname.slice(base.length)
          : "/";
        location.replace(
          base +
            "/?p=" +
            encodeURIComponent(path + location.search) +
            location.hash,
        );
      })();
    </script>
  </head>
  <body>
    <a href="/willianfonseca-portfolio/">Zur Startseite</a>
  </body>
</html>
